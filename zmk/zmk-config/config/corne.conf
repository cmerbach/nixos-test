# The name of the keyboard (max 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Corne Cherry v3"

# Enable deep sleep support
CONFIG_ZMK_SLEEP=n

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
# CONFIG_ZMK_SPLIT_BLE=y

# Enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# -----( USB Support )----- #
# Enable ZMK as a USB keyboard
CONFIG_ZMK_USB=y

# Enable USB Boot protocol support
CONFIG_ZMK_USB_BOOT=y

# -----( Bluetooth Support )----- #
# Enable ZMK as a Bluetooth keyboard
CONFIG_ZMK_BLE=y


# Clears all bond information from the keyboard on startup
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y


# Keep sleep enabled but extend timeouts significantly
# Idle after 1 hour, deep sleep after 2 hours
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_TIMEOUT=3600000
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000


# Debounce optimization for double key presses
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
